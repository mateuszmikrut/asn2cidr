[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "asn2cidr"
dynamic = ["version", "dependencies"]
description = "Print an ASN's announced IP prefixes using RIPEstat"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mateusz Mikrut"}]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
]

[project.urls]
Homepage = "https://github.com/mateuszmikrut/asn2cidr"
Issues = "https://github.com/mateuszmikrut/asn2cidr/issues"
Releases = "https://github.com/mateuszmikrut/asn2cidr/releases"

[project.scripts]
asn2cidr = "ans2cidr:main"

[tool.setuptools]
py-modules = ["ans2cidr"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]
fallback_version = "0.0.0"
